<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#fffad4" />
    <script>
      // pick the theme before first paint so dark mode never flashes light
      try {
        document.documentElement.dataset.theme = localStorage.getItem('theme') === 'dark' ? 'dark' : 'light';
      } catch (e) {}
    </script>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Schoolbell&display=swap" rel="stylesheet" />
    <title>draw battle! a competitive team drawing game</title>
    <meta name="description" property="description" content="draw battle is a free online multiplayer drawing game where two teams face off with a frantic final round. Grab your phone, tablet, or computer and draw & guess words faster than the other team to win!" />
    <meta name="og:title" property="og:title" content="draw battle!" />
  </head>
  <body>
    <noscript>
      <strong>We're sorry but draw battle doesn't work properly without JavaScript enabled. Please enable it to continue.</strong>
    </noscript>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
